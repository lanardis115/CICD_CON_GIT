name: Playwright Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Scarica il codice del repository sulla macchina Linux di GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Prepara l'ambiente Python 3.11
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Installa le librerie necessarie per il testing
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright pytest pytest-html

    # 4. Installa Chromium con le dipendenze di sistema Linux
    - name: Install Playwright Browsers
      run: playwright install --with-deps chromium

    # 5. Esegue i test e genera il report HTML
    - name: Run Playwright Tests
      run: pytest --html=report.html --self-contained-html

    # 6. Salva il report HTML come Artifact scaricabile a fine esecuzione
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: report.html